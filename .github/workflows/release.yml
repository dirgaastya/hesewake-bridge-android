name: Release

# Pushing a version tag (e.g. v0.1.0) tests and builds the signed APK, then creates a draft GitHub Release.
# Needs the repository secrets HESEWAKE_KEYSTORE_B64 (the .jks file, base64) and HESEWAKE_KEYSTORE_PASSWORD.
on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
      # the runner image already has the Android SDK; accept the licenses and make sure the platform is there
      - name: Android platform
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Tag must match versionName
        run: |
          ver=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts | head -1)
          if [ "v$ver" != "${{ github.ref_name }}" ]; then echo "Tag ${{ github.ref_name }} does not match versionName ($ver)"; exit 1; fi
          echo "VERSION=$ver" >> "$GITHUB_ENV"

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Signed release APK
        env:
          KEYSTORE_B64: ${{ secrets.HESEWAKE_KEYSTORE_B64 }}
          HESEWAKE_KEYSTORE_PASSWORD: ${{ secrets.HESEWAKE_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$HESEWAKE_KEYSTORE_PASSWORD" ]; then echo "The signing secrets are not set"; exit 1; fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          HESEWAKE_KEYSTORE="$RUNNER_TEMP/release.jks" ./gradlew :app:assembleRelease
          rm -f "$RUNNER_TEMP/release.jks"
          cp app/build/outputs/apk/release/app-release.apk "HesewakeBridge-$VERSION.apk"
          sha256sum "HesewakeBridge-$VERSION.apk" > SHA256SUMS

      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" "HesewakeBridge-$VERSION.apk" SHA256SUMS --draft --title "Hesewake Bridge $VERSION" --generate-notes
